<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Viral Kariya">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"><animate attributeName="stop-color" values="#00f5d4;#9b5de5;#f15bb5;#00f5d4" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f15bb5"><animate attributeName="stop-color" values="#f15bb5;#00f5d4;#9b5de5;#f15bb5" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".04"/></pattern>
    <clipPath id="c"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font:800 84px 'Courier New',ui-monospace,monospace;letter-spacing:6px;text-anchor:middle}
    .s{font:500 15px 'Courier New',ui-monospace,monospace;letter-spacing:7px;text-anchor:middle;fill:#8b949e}
    .a{animation:gl 3.2s steps(1,end) infinite}
    .b{animation:gl2 3.2s steps(1,end) infinite}
    @keyframes gl{0%,88%,100%{transform:translate(-3px,0)}90%{transform:translate(-9px,2px)}94%{transform:translate(6px,-2px)}}
    @keyframes gl2{0%,88%,100%{transform:translate(3px,0)}90%{transform:translate(9px,-2px)}94%{transform:translate(-6px,2px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="200" fill="#0b0f19"/>
    <rect width="900" height="200" fill="url(#scan)"/>
    <rect width="900" height="3" fill="url(#g)" opacity=".9"/>
    <rect y="197" width="900" height="3" fill="url(#g)" opacity=".9"/>
    <rect width="900" height="6" fill="#fff" opacity=".05"><animate attributeName="y" from="-10" to="210" dur="4s" repeatCount="indefinite"/></rect>
    <text x="450" y="112" class="t a" fill="#00f5d4" opacity=".75">VIRAL KARIYA</text>
    <text x="450" y="112" class="t b" fill="#f15bb5" opacity=".75">VIRAL KARIYA</text>
    <text x="450" y="112" class="t" fill="url(#g)">VIRAL KARIYA</text>
    <text x="450" y="152" class="s">CURIOSITY  //  CODE  //  CONSEQUENCES</text>
    <text x="450" y="182" class="s" style="font-size:12px;letter-spacing:3px;fill:#00f5d4">&gt; connect on linkedin_<animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></text>
  </g>
</svg>
